services:
  - type: web
    name: study-program-rag-chatbot
    env: python
    plan: standard
    
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DEVICE
        value: cpu
      - key: PYTHONUNBUFFERED
        value: 1
      - key: LLM_MODEL_NAME
        value: meta-llama/Llama-2-7b-hf
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/distilbert-base-uncased
      - key: VECTOR_DB_TYPE
        value: chroma
      - key: CHROMA_PATH
        value: /app/data/vector_store
      - key: MODELS_CACHE_DIR
        value: /app/data/models_cache
      - key: DATASET_PATH
        value: /app/data/datasets
